name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coordinator-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            production/requirements.txt
            production/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -r production/requirements.txt -r production/requirements-dev.txt
      - run: python -m pytest production/tests/test_api.py -q
      - run: python -m py_compile host-linux/nawah_host.py
      - run: python host-linux/nawah_host.py --self-test
      - run: node --check web/i18n.js
      - run: node --check web/landing.js
      - run: node --check web/app.js

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build host-win/NawahHost.csproj --configuration Release
